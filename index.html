<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0b12">
<title>Vibe</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #09090f;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
}

button, input, textarea {
    font: inherit;
}

.app {
    max-width: 520px;
    margin: auto;
    min-height: 100vh;
    padding-bottom: 80px;
}

/* HEADER */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px;
    position: sticky;
    top: 0;
    background: rgba(9,9,15,.92);
    backdrop-filter: blur(15px);
    z-index: 20;
}

.logo {
    font-size: 28px;
    font-weight: 800;
}

.logo span {
    color: #ff477e;
}

.icon-btn {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 50%;
    background: #191923;
    color: white;
    font-size: 20px;
}

/* SCREENS */

.screen {
    display: none;
    padding: 0 18px;
}

.screen.active {
    display: block;
}

/* DISCOVER */

.card-area {
    position: relative;
    height: 590px;
    margin-top: 8px;
}

.profile-card {
    position: absolute;
    inset: 0;
    border-radius: 28px;
    overflow: hidden;
    background: linear-gradient(145deg, #30213e, #11111a);
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
    user-select: none;
    transition: transform .3s ease, opacity .3s ease;
}

.profile-photo {
    height: 66%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 120px;
    background: linear-gradient(145deg, #46305e, #151525);
}

.profile-info {
    padding: 18px 20px;
}

.name {
    font-size: 29px;
    font-weight: 800;
}

.age {
    font-weight: 400;
    opacity: .75;
}

.location {
    color: #aaa;
    margin-top: 4px;
}

.bio {
    margin-top: 10px;
    line-height: 1.4;
    color: #ddd;
}

.tags {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    margin-top: 12px;
}

.tag {
    background: #252531;
    border-radius: 20px;
    padding: 7px 11px;
    font-size: 13px;
}

.compatibility {
    position: absolute;
    top: 16px;
    left: 16px;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(8px);
    padding: 9px 13px;
    border-radius: 20px;
    font-weight: 700;
}

.swipe-buttons {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-top: 18px;
}

.swipe-btn {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: 2px solid #292936;
    background: #15151e;
    font-size: 29px;
    color: white;
}

.swipe-btn:active {
    transform: scale(.9);
}

.pass {
    color: #ff5b67;
}

.like {
    color: #4dff98;
}

/* MATCHES */

.section-title {
    font-size: 28px;
    font-weight: 800;
    margin: 15px 0 20px;
}

.match {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #15151e;
    padding: 13px;
    border-radius: 18px;
    margin-bottom: 10px;
}

.match-avatar {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    background: #292942;
}

.match-name {
    font-weight: 700;
}

.match-status {
    color: #999;
    font-size: 13px;
    margin-top: 3px;
}

.empty {
    text-align: center;
    color: #888;
    padding: 50px 20px;
}

/* CHAT */

.chat-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0 18px;
}

.back {
    background: none;
    border: 0;
    color: white;
    font-size: 26px;
}

.chat-avatar {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #292942;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
}

.messages {
    height: calc(100vh - 190px);
    overflow-y: auto;
    padding-bottom: 15px;
}

.message {
    max-width: 78%;
    padding: 11px 14px;
    border-radius: 18px;
    margin: 8px 0;
    line-height: 1.4;
}

.message.ai {
    background: #20202b;
    border-bottom-left-radius: 5px;
}

.message.you {
    background: #ff477e;
    margin-left: auto;
    border-bottom-right-radius: 5px;
}

.chat-input {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(520px, 100%);
    padding: 10px 14px;
    background: rgba(9,9,15,.95);
    display: flex;
    gap: 8px;
}

.chat-input input {
    flex: 1;
    border: 0;
    outline: 0;
    background: #191923;
    color: white;
    border-radius: 24px;
    padding: 13px 16px;
}

.send {
    width: 48px;
    border: 0;
    border-radius: 50%;
    background: #ff477e;
    color: white;
    font-size: 20px;
}

/* PROFILE */

.profile-box {
    background: #15151e;
    border-radius: 25px;
    padding: 22px;
}

.big-avatar {
    width: 105px;
    height: 105px;
    border-radius: 50%;
    background: #292942;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 55px;
}

.field {
    margin-top: 15px;
}

.field label {
    display: block;
    color: #aaa;
    margin-bottom: 6px;
    font-size: 14px;
}

.field input,
.field textarea {
    width: 100%;
    border: 1px solid #30303c;
    background: #0e0e15;
    color: white;
    border-radius: 12px;
    padding: 12px;
    outline: none;
}

.field textarea {
    min-height: 90px;
    resize: vertical;
}

.primary {
    width: 100%;
    margin-top: 20px;
    border: 0;
    border-radius: 15px;
    padding: 14px;
    background: #ff477e;
    color: white;
    font-weight: 700;
}

/* NAV */

.nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(520px, 100%);
    height: 68px;
    background: rgba(18,18,26,.96);
    border-top: 1px solid #292934;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 30;
}

.nav button {
    border: 0;
    background: none;
    color: #777;
    font-size: 23px;
}

.nav button.active {
    color: #ff477e;
}

.nav small {
    display: block;
    font-size: 10px;
    margin-top: 2px;
}

/* MATCH POPUP */

.popup {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.popup.show {
    display: flex;
}

.popup-box {
    width: 100%;
    max-width: 390px;
    background: #171720;
    border-radius: 28px;
    padding: 30px 22px;
    text-align: center;
}

.popup-avatar {
    font-size: 80px;
}

.popup h2 {
    font-size: 32px;
    margin: 5px 0;
}

.popup p {
    color: #aaa;
}

.popup button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 14px;
    background: #ff477e;
    color: white;
    font-weight: 700;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="app">

<header class="header">
    <div class="logo">v<span>i</span>be</div>
    <button class="icon-btn" onclick="showScreen('profile')">👤</button>
</header>

<!-- DISCOVER -->

<section id="discover" class="screen active">

    <div class="section-title">Discover</div>

    <div class="card-area" id="cardArea"></div>

    <div class="swipe-buttons">
        <button class="swipe-btn pass" onclick="swipe(false)">✕</button>
        <button class="swipe-btn like" onclick="swipe(true)">♥</button>
    </div>

</section>

<!-- MATCHES -->

<section id="matches" class="screen">

    <div class="section-title">Your Connections</div>

    <div id="matchList"></div>

</section>

<!-- CHAT -->

<section id="chat" class="screen">

    <div class="chat-header">
        <button class="back" onclick="showScreen('matches')">‹</button>
        <div class="chat-avatar" id="chatAvatar">🙂</div>
        <div>
            <strong id="chatName">Person</strong>
            <div style="color:#888;font-size:12px;">AI character</div>
        </div>
    </div>

    <div class="messages" id="messages"></div>

</section>

<!-- PROFILE -->

<section id="profile" class="screen">

    <div class="section-title">Your Profile</div>

    <div class="profile-box">

        <div class="big-avatar">😎</div>

        <div class="field">
            <label>Name</label>
            <input id="yourName" placeholder="Your name">
        </div>

        <div class="field">
            <label>Age</label>
            <input id="yourAge" type="number" placeholder="18+">
        </div>

        <div class="field">
            <label>About you</label>
            <textarea id="yourBio" placeholder="Tell people what you're like..."></textarea>
        </div>

        <div class="field">
            <label>Interests</label>
            <input id="yourInterests" placeholder="Gaming, music, sports...">
        </div>

        <button class="primary" onclick="saveProfile()">Save Profile</button>

    </div>

</section>

</div>

<!-- NAVIGATION -->

<nav class="nav">

    <button id="navDiscover" class="active" onclick="showScreen('discover')">
        💫<small>Discover</small>
    </button>

    <button id="navMatches" onclick="showScreen('matches')">
        💕<small>Matches</small>
    </button>

    <button id="navProfile" onclick="showScreen('profile')">
        👤<small>Profile</small>
    </button>

</nav>

<!-- MATCH POPUP -->

<div class="popup" id="matchPopup">

    <div class="popup-box">

        <div class="popup-avatar" id="popupAvatar">❤️</div>

        <h2>It's a connection! 🎉</h2>

        <p id="popupText"></p>

        <button onclick="closeMatch()">Start chatting</button>

        <button style="background:#292934;" onclick="closePopupOnly()">Keep discovering</button>

    </div>

</div>

<script>

const characters = [

{
    id: 1,
    name: "Maya",
    age: 21,
    avatar: "🎨",
    location: "Somewhere nearby",
    bio: "I'm usually listening to music, drawing something, or looking for a new game to obsess over. I'm sarcastic but pretty chill.",
    interests: ["Art","Gaming","Music"],
    traits: {
        gaming: 9,
        music: 9,
        art: 10,
        sports: 3,
        social: 5,
        humor: 9,
        chill: 9
    },
    personality: "sarcastic",
    replies: [
        "Okay wait... that's actually interesting 😂",
        "I feel like we'd get along pretty well.",
        "No way 😭 I literally love that.",
        "Okay you're gonna have to explain that one to me.",
        "Honestly? I respect that.",
        "You're kinda funny, I'll give you that."
    ]
},

{
    id: 2,
    name: "Jordan",
    age: 22,
    avatar: "🎮",
    location: "Somewhere nearby",
    bio: "Competitive gamer, terrible cook, professional procrastinator. I will absolutely challenge you to a game and then blame lag when I lose.",
    interests: ["Gaming","Movies","Technology"],
    traits: {
        gaming: 10,
        music: 5,
        art: 3,
        sports: 6,
        social: 7,
        humor: 10,
        chill: 7
    },
    personality: "funny",
    replies: [
        "BRO 😂",
        "Alright, you're officially getting challenged.",
        "That's actually hilarious.",
        "I already know we'd end up arguing over which game is better.",
        "Okay that's a W.",
        "You seem cool ngl."
    ]
},

{
    id: 3,
    name: "Avery",
    age: 20,
    avatar: "📚",
    location: "Somewhere nearby",
    bio: "Books, coffee, late-night conversations and random deep questions. I'm quiet at first but once I get comfortable I don't shut up.",
    interests: ["Books","Music","Movies"],
    traits: {
        gaming: 3,
        music: 8,
        art: 6,
        sports: 2,
        social: 3,
        humor: 6,
        chill: 10
    },
    personality: "thoughtful",
    replies: [
        "Wait, I actually want to hear more about that.",
        "That's an interesting way of looking at it.",
        "Okay, now you've got me thinking.",
        "I feel like that's something we'd have a long conversation about.",
        "That's actually really cool.",
        "You seem like someone who has interesting stories."
    ]
},

{
    id: 4,
    name: "Chris",
    age: 23,
    avatar: "🏀",
    location: "Somewhere nearby",
    bio: "Sports, gym, hanging with friends and finding something fun to do. I'm competitive about basically everything.",
    interests: ["Sports","Fitness","Movies"],
    traits: {
        gaming: 5,
        music: 6,
        art: 2,
        sports: 10,
        social: 10,
        humor: 8,
        chill: 5
    },
    personality: "outgoing",
    replies: [
        "Let's gooo 😂",
        "You gotta come play sometime.",
        "I'm definitely competitive, just warning you.",
        "Okay that's actually sick.",
        "We'd probably have a lot of fun.",
        "Nahhh there's no way 😂"
    ]
},

{
    id: 5,
    name: "Riley",
    age: 21,
    avatar: "🎧",
    location: "Somewhere nearby",
    bio: "Music is basically my entire personality. I make playlists for everything and judge people based on their music taste. Kidding... mostly.",
    interests: ["Music","Concerts","Movies"],
    traits: {
        gaming: 4,
        music: 10,
        art: 7,
        sports: 3,
        social: 7,
        humor: 8,
        chill: 8
    },
    personality: "playful",
    replies: [
        "Okay but what's your favorite song right now?",
        "I need to know what kind of music you listen to 👀",
        "Wait I have a playlist for that.",
        "Okayyyy I see you.",
        "That's a surprisingly good answer.",
        "We might have to exchange playlists."
    ]
}

];

let currentIndex = 0;
let matches = JSON.parse(localStorage.getItem("vibeMatches") || "[]");
let profile = JSON.parse(localStorage.getItem("vibeProfile") || "{}");
let activeCharacter = null;

function getScore(character) {

    if (!profile.interests) return 70;

    const interests = profile.interests
        .toLowerCase()
        .split(",")
        .map(x => x.trim());

    let score = 45;

    character.interests.forEach(interest => {

        if (interests.includes(interest.toLowerCase())) {
            score += 9;
        }

    });

    if (profile.bio) {

        const bio = profile.bio.toLowerCase();

        if (bio.includes("funny") && character.traits.humor >= 8)
            score += 7;

        if (bio.includes("gaming") && character.traits.gaming >= 8)
            score += 7;

        if (bio.includes("music") && character.traits.music >= 8)
            score += 7;

        if (bio.includes("sport") && character.traits.sports >= 8)
            score += 7;

        if (bio.includes("art") && character.traits.art >= 8)
            score += 7;
    }

    return Math.min(99, score);
}

function renderCard() {

    const area = document.getElementById("cardArea");

    if (currentIndex >= characters.length) {

        area.innerHTML = `
            <div class="empty">
                <div style="font-size:60px;">✨</div>
                <h2>You've seen everyone</h2>
                <p>More fictional people will appear here as the world grows.</p>
            </div>
        `;

        return;
    }

    const c = characters[currentIndex];
    const score = getScore(c);

    area.innerHTML = `

        <div class="profile-card" id="currentCard">

            <div class="compatibility">
                ✨ ${score}% vibe
            </div>

            <div class="profile-photo">
                ${c.avatar}
            </div>

            <div class="profile-info">

                <div class="name">
                    ${c.name}
                    <span class="age">${c.age}</span>
                </div>

                <div class="location">📍 ${c.location}</div>

                <div class="bio">${c.bio}</div>

                <div class="tags">

                    ${c.interests.map(x =>
                        `<div class="tag">${x}</div>`
                    ).join("")}

                </div>

            </div>

        </div>
    `;
}

function swipe(liked) {

    if (currentIndex >= characters.length) return;

    const character = characters[currentIndex];

    if (liked) {

        const score = getScore(character);

        /*
        The AI character has its own personality.
        Higher compatibility = higher chance they like you back.
        */

        const randomFactor = Math.random() * 35;

        const mutualThreshold = score + randomFactor;

        if (mutualThreshold >= 88) {

            if (!matches.find(x => x.id === character.id)) {
                matches.push(character);
                localStorage.setItem("vibeMatches", JSON.stringify(matches));
            }

            activeCharacter = character;

            document.getElementById("popupAvatar").textContent = character.avatar;

            document.getElementById("popupText").textContent =
                `${character.name} seems like they would genuinely get along with you.`;

            document.getElementById("matchPopup").classList.add("show");

        }
    }

    currentIndex++;

    setTimeout(renderCard, 180);
}

function showScreen(screen) {

    document.querySelectorAll(".screen")
        .forEach(x => x.classList.remove("active"));

    document.getElementById(screen)
        .classList.add("active");

    document.querySelectorAll(".nav button")
        .forEach(x => x.classList.remove("active"));

    if (screen === "discover")
        document.getElementById("navDiscover").classList.add("active");

    if (screen === "matches")
        document.getElementById("navMatches").classList.add("active");

    if (screen === "profile")
        document.getElementById("navProfile").classList.add("active");

    if (screen === "matches")
        renderMatches();
}

function renderMatches() {

    const list = document.getElementById("matchList");

    if (matches.length === 0) {

        list.innerHTML = `
            <div class="empty">
                <div style="font-size:60px;">💕</div>
                <h3>No connections yet</h3>
                <p>Keep discovering people who might click with you.</p>
            </div>
        `;

        return;
    }

    list.innerHTML = matches.map(c => `

        <div class="match" onclick="openChat(${c.id})">

            <div class="match-avatar">
                ${c.avatar}
            </div>

            <div>

                <div class="match-name">
                    ${c.name}, ${c.age}
                </div>

                <div class="match-status">
                    Start a conversation →
                </div>

            </div>

        </div>

    `).join("");
}

function openChat(id) {

    activeCharacter = characters.find(x => x.id === id);

    showScreen("chat");

    document.getElementById("chatName").textContent =
        activeCharacter.name;

    document.getElementById("chatAvatar").textContent =
        activeCharacter.avatar;

    const saved =
        JSON.parse(localStorage.getItem("chat_" + id) || "[]");

    const messages = document.getElementById("messages");

    messages.innerHTML = "";

    if (saved.length === 0) {

        addMessage(
            `Hey! It's ${activeCharacter.name} 😊`,
            "ai"
        );

        addMessage(
            activeCharacter.replies[0],
            "ai"
        );

    } else {

        saved.forEach(m =>
            addMessage(m.text, m.sender)
        );

    }

    createChatInput();
}

function createChatInput() {

    if (document.getElementById("chatInputBox"))
        return;

    const box = document.createElement("div");

    box.className = "chat-input";
    box.id = "chatInputBox";

    box.innerHTML = `
        <input id="messageInput"
               placeholder="Message ${activeCharacter.name}..."
               onkeydown="if(event.key==='Enter') sendMessage()">

        <button class="send" onclick="sendMessage()">➤</button>
    `;

    document.body.appendChild(box);
}

function addMessage(text, sender) {

    const messages = document.getElementById("messages");

    const div = document.createElement("div");

    div.className = "message " + sender;

    div.textContent = text;

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;
}

function sendMessage() {

    const input = document.getElementById("messageInput");

    if (!input || !input.value.trim()) return;

    const text = input.value.trim();

    addMessage(text, "you");

    const id = activeCharacter.id;

    let saved =
        JSON.parse(localStorage.getItem("chat_" + id) || "[]");

    saved.push({
        text: text,
        sender: "you"
    });

    localStorage.setItem("chat_" + id, JSON.stringify(saved));

    input.value = "";

    setTimeout(() => {

        const replies = activeCharacter.replies;

        const reply =
            replies[Math.floor(Math.random() * replies.length)];

        addMessage(reply, "ai");

        saved.push({
            text: reply,
            sender: "ai"
        });

        localStorage.setItem(
            "chat_" + id,
            JSON.stringify(saved)
        );

    }, 700 + Math.random() * 1000);
}

function saveProfile() {

    profile = {

        name: document.getElementById("yourName").value,

        age: document.getElementById("yourAge").value,

        bio: document.getElementById("yourBio").value,

        interests: document.getElementById("yourInterests").value

    };

    localStorage.setItem(
        "vibeProfile",
        JSON.stringify(profile)
    );

    alert("Profile saved! 🔥");

    currentIndex = 0;

    renderCard();
}

function loadProfile() {

    document.getElementById("yourName").value =
        profile.name || "";

    document.getElementById("yourAge").value =
        profile.age || "";

    document.getElementById("yourBio").value =
        profile.bio || "";

    document.getElementById("yourInterests").value =
        profile.interests || "";
}

function closeMatch() {

    document.getElementById("matchPopup")
        .classList.remove("show");

    if (activeCharacter)
        openChat(activeCharacter.id);
}

function closePopupOnly() {

    document.getElementById("matchPopup")
        .classList.remove("show");

}

renderCard();
renderMatches();
loadProfile();

</script>

</body>
</html>
